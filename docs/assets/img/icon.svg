<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Datum">
  <title>Datum</title>
  <rect width="64" height="64" rx="14" fill="#2d6cdf"/>
  <!-- A datum is a reference point, so the mark is a survey point: a fixed
       centre with tick marks measuring back to it. -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="5.5" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M32 8v7"/>
    <path d="M32 49v7"/>
    <path d="M8 32h7"/>
    <path d="M49 32h7"/>
  </g>
</svg>
