[project]
site_name = "Datum"
site_url = "https://getdatum.sh/"
site_description = "Datum continuously reconciles Linux systems against declarative desired state stored in Git."
site_author = "dsgnr"
copyright = "&copy; 2026 dsgnr"

repo_url = "https://github.com/dsgnr/datum"
repo_name = "dsgnr/datum"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Introduction" = [
    "introduction/index.md",
    "introduction/why-datum.md",
    "introduction/how-datum-works.md",
    "introduction/design-principles.md",
    "introduction/project-status.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/desired-state.md",
    "concepts/observed-state.md",
    "concepts/drift.md",
    "concepts/plan.md",
    "concepts/reconciliation.md",
  ] },
  { "Architecture" = [
    "architecture/index.md",
    "architecture/components.md",
    "architecture/reconciliation-flow.md",
  ] },
]

# Treat broken internal links, unknown anchors and unresolved references as
# build warnings. Combined with `zensical build --strict` they fail the build.
[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tilde = {}

# Render fenced `mermaid` blocks as diagrams instead of highlighted code.
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
