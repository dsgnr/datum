name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and attach files to it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version line in `datum version` is stamped by the Go toolchain from the
          # checkout, so the tag and its history have to be present.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag of v0.1.0-alpha.1 becomes 0.1.0~alpha.1. Neither dpkg nor rpm accepts a
      # hyphen in a version, and a tilde sorts below the release it precedes in both, which
      # is what a pre-release has to do.
      - name: Work out the version
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version=$(printf '%s' "${tag#v}" | tr '-' '~')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $tag as $version"

      - run: make lint

      # A tag can point at any commit, so the provider and repository suites run here
      # rather than relying on a push to main having tested the same tree. The git and
      # source suites cover signature verification and revision selection, which sit
      # behind a build tag and so do not run under plain `go test ./...`.
      - name: Integration suites
        run: |
          set -e
          for suite in test-git test-source test-apt test-dnf test-sysctl test-user test-systemd; do
            echo "::group::$suite"
            make "$suite"
            echo "::endgroup::"
          done

      - name: Build the binaries
        run: make dist VERSION='${{ steps.version.outputs.version }}'

      - name: Build the packages
        run: make package-release VERSION='${{ steps.version.outputs.version }}'

      # The packages are installed by the real package managers and inspected from inside
      # the container, so a scriptlet that fails does so here and not on somebody's host.
      - name: Install what was built and check it
        run: make test-package VERSION='${{ steps.version.outputs.version }}'

      - name: Check the binaries report the version they were tagged as
        run: |
          set -eu
          expected='${{ steps.version.outputs.version }}'
          got=$(./bin/datum version | head -1)
          echo "$got"
          case "$got" in
            "datum $expected"*) ;;
            *) echo "expected 'datum $expected', got '$got'"; exit 1 ;;
          esac

      - name: Collect the artefacts
        run: |
          set -eu
          mkdir -p release
          cp bin/datum-linux-amd64 bin/datum-linux-arm64 release/
          cp dist/*.deb dist/*.rpm release/
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Datum refuses desired state that is not signed by a trusted key, so its own
      # artefacts are signed too. Signing SHA256SUMS covers every file listed in it,
      # since altering an artefact without altering the list is detected by the
      # checksum and altering the list is detected by the signature.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is not set, so this release would be unsigned" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          printf '%s' "$RELEASE_SIGNING_PASSPHRASE" > /tmp/pass
          gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/pass \
              --local-user "$keyid" --armor --detach-sign \
              --output release/SHA256SUMS.asc release/SHA256SUMS
          shred -u /tmp/pass
          gpg --verify release/SHA256SUMS.asc release/SHA256SUMS
          gpg --batch --yes --export --armor "$keyid" > release/signing-key.asc

      # A pre-release tag is marked as one, so it does not become "latest" for anybody
      # installing without pinning. Anything with a suffix after the version is a
      # pre-release, which covers alpha, beta and rc alike.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='${{ steps.version.outputs.tag }}'
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" release/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            $prerelease
