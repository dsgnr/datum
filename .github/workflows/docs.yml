name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/mermaid/package.json

      # Mermaid is rendered in the browser, so the build below never parses it.
      - name: Check the diagrams
        run: |
          npm install --prefix test/mermaid --no-audit --no-fund
          node test/mermaid/check.mjs docs

      # Strict mode fails the build on broken internal links and unknown
      # anchors, so a merged pull request cannot leave the site broken.
      - run: zensical build --strict --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # Requires GitHub Pages to be enabled for the repository with
      # "GitHub Actions" selected as the source.
      - uses: actions/deploy-pages@v4
        id: deployment
